workspace:
  image: base
  resources: { vcpuCount: 2, ramMb: 2048, diskSizeMb: 8192 }
  deployment:
    strategy: incremental
apps:
  web:
    path: ./web
    kind: service
    source:
      kind: git
      repo: https://github.com/rigbox-dev/rigbox-examples.git
      branch: main
    port: 8080
    start: python3 server.py
    env:
      PORT: "8080"
      APP_NAME: web
    health:
      path: /healthz
  tools:
    path: ./tools
    kind: cli
    source:
      kind: git
      repo: https://github.com/rigbox-dev/rigbox-examples.git
      branch: main
    executables:
      workspace-info: workspace-info
