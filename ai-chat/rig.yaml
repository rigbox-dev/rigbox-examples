apps:
  ai-chat:
    port: 8080
    install: |
      python3 -m venv --copies .venv
      .venv/bin/python -m pip install -r requirements.txt
    start: .venv/bin/uvicorn chat:app --host 0.0.0.0 --port 8080
    health:
      path: /healthz
      timeoutSeconds: 30
    ai:
      managed: true
    params:
      - key: model
        type: select
        label: Model alias
        description: Portable model alias resolved by the managed AI proxy.
        group: AI
        default: rigbox/default
        envVar: MODEL
        options:
          - { value: rigbox/default, label: "Default" }
          - { value: rigbox/fast, label: "Fast" }
          - { value: rigbox/free, label: "Free" }
    dependencyInputs:
      - requirements.txt
    path: .
    source:
      kind: git
      repo: https://github.com/rigbox-dev/rigbox-examples.git
      branch: rigbox/deploy/ws-jzu47kah
workspace:
  resources: { ramMb: 2048, vcpuCount: 2, diskSizeMb: 8192 }
  deployment:
    strategy: incremental
  image: base
