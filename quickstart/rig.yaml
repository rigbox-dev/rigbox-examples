name: quickstart
port: 8080
# Minimal TypeScript app — 1GB is plenty.
workspace:
  resources: { ramMb: 1024, vcpuCount: 1, diskSizeMb: 3072 }
  deployment:
    strategy: incremental
install: npm ci
start: npm start
health:
  path: /healthz
  timeoutSeconds: 30
dependencyInputs:
  - package.json
  - package-lock.json

# This default config deploys the LOCAL working copy (rsync). To deploy straight
# from git instead, uncomment the block below — that one change is the whole
# difference between the two deploy source modes. See the README.
#
# source:
#   kind: git
#   repo: https://github.com/rigbox-dev/rigbox-examples.git
#   branch: main
