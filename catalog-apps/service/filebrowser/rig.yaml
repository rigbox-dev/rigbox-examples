name: filebrowser
port: 8080
# File Browser is a tiny single Go binary — the catalog item declares 128MB/64MB,
# but the VM floors push to a usable minimum and leave headroom for uploads.
workspace:
  resources: { ramMb: 256, vcpuCount: 1, diskSizeMb: 1024 }
  deployment:
    strategy: image
# Freeze the pinned File Browser binary into an image: `rig deploy` runs
# `install:` once in a builder VM and later deploys reuse the cached image
# instead of re-downloading. Bump FB_VERSION here to upgrade.
reproducible: true
install: |
  set -euo pipefail
  # File Browser ships as a single static Go binary — no toolchain needed.
  # Frozen into the reproducible image so deploys don't re-download it.
  FB_VERSION=v2.32.0
  ARCH=$(uname -m)
  case "$ARCH" in
    x86_64|amd64)  FB_ARCH="linux-amd64"  ;;
    aarch64|arm64) FB_ARCH="linux-arm64"  ;;
    *) echo "Unsupported arch: $ARCH" >&2 ; exit 1 ;;
  esac
  curl -fsSL "https://github.com/filebrowser/filebrowser/releases/download/${FB_VERSION}/${FB_ARCH}-filebrowser.tar.gz" \
    | sudo tar -xz -C /usr/local/bin/ filebrowser
  sudo chmod +x /usr/local/bin/filebrowser
  /usr/local/bin/filebrowser version
# Serve /home/developer/data so uploads and edits persist across redeploys.
# The catalog item uses --noauth (gateway-fronted); the example also lets
# filebrowser's default admin/admin login take effect so you can see its
# own auth UI. Flip to --noauth if you prefer relying on the gateway only.
start: >-
  /usr/local/bin/filebrowser --address 0.0.0.0 --port 8080 --root /home/developer/data --database /home/developer/data/filebrowser/filebrowser.db
health:
  path: /health
  timeoutSeconds: 30
env:
  DATA_DIR: /home/developer/data
