name: hermes-agent
# Hermes' dashboard binds 0.0.0.0:9119 and refuses non-loopback without
# `--insecure`. The trust boundary is the rigbox subdomain layer.
port: 9119
# Playwright plus uv-managed Python 3.11, Node 22, and a pre-built Vite SPA
# bundle — the install footprint is heavier than the catalog minimum, so bump
# the workspace disk.
workspace:
  deployment:
    strategy: image
  # diskSizeMb holds the frozen install (uv CPython, Node 22, SPA build) and
  # sizes the builder VM that produces it.
  resources: { ramMb: 2048, vcpuCount: 2, diskSizeMb: 6144 }
# Freeze the whole upstream install into an image: `rig deploy` runs `install:`
# once in a builder VM, snapshots the rootfs, and later deploys with unchanged
# inputs boot from the cached image instead of re-running the installer.
# Footprint note: the builder VM boots with the platform default 3GB disk and
# this install is close to it — see the README.
reproducible: true
install: |
  set -euo pipefail
  # Hermes Agent (NousResearch/hermes-agent) — a self-improving AI agent with a
  # web dashboard and a separate multi-platform messaging gateway (Telegram,
  # Discord, Slack, WhatsApp, Signal). The upstream installer pulls uv, Python
  # 3.11, Node 22, Playwright, and a fairly large npm tree to pre-build the Vite
  # SPA bundle; this script freezes it all into the image once so deploys don't
  # re-run it.
  #
  # `--skip-setup` keeps the installer non-interactive; the curl|bash pipe is
  # non-tty so the upstream script also auto-detects non-interactive mode. The
  # script runs as `developer`, which is what the upstream installer expects.
  export HERMES_HOME=/home/developer/.hermes
  mkdir -p "$HERMES_HOME"
  curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh \
    | bash -s -- --skip-setup

  # Pre-build the dashboard SPA — `hermes dashboard` would otherwise run
  # `npm ci && npm run build` lazily on the first request, blowing the
  # readiness probe. Skipped when the bundle is already there (idempotent).
  WEB_DIR="$HERMES_HOME/hermes-agent/web"
  DIST_DIR="$HERMES_HOME/hermes-agent/hermes_cli/web_dist"
  if [ -d "$WEB_DIR" ] && [ ! -f "$DIST_DIR/index.html" ]; then
    (cd "$WEB_DIR" \
      && { npm ci --silent || npm install --silent; } \
      && npm run build --silent)
    rm -rf "$WEB_DIR/node_modules" "$HOME/.npm/_cacache"
  fi
  test -f "$DIST_DIR/index.html"

  # Trim install-only caches that the upstream installer leaves behind.
  rm -rf "$HOME/.cache/ms-playwright" "$HOME/.cache/camoufox" \
         "$HOME/.cache/huggingface" "$HOME/.cache/pip" "$HOME/.cache/uv" \
         "$HOME/.npm/_cacache" /tmp/camoufox-* /tmp/playwright-* 2>/dev/null || true

  # Ensure ~/.local/bin/hermes is the canonical launcher (the upstream installer
  # occasionally truncates it after dirty-exiting on slow disks).
  VENV_HERMES="$HERMES_HOME/hermes-agent/venv/bin/hermes"
  if [ ! -s "$HOME/.local/bin/hermes" ] && [ -x "$VENV_HERMES" ]; then
    mkdir -p "$HOME/.local/bin"
    printf "%s\n" "#!/usr/bin/env bash" "unset PYTHONPATH" "unset PYTHONHOME" \
      "exec $VENV_HERMES \"\$@\"" > "$HOME/.local/bin/hermes"
    chmod +x "$HOME/.local/bin/hermes"
  fi
  test -x "$HOME/.local/bin/hermes"

  touch "$HERMES_HOME/.env"
  chmod 600 "$HERMES_HOME/.env"
start: >-
  /home/developer/.local/bin/hermes dashboard
  --host 0.0.0.0 --port 9119 --no-open --insecure
health:
  # The only public (no-session-token) endpoint on the dashboard.
  path: /api/status
  timeoutSeconds: 90
# Hermes natively reads OPENAI_API_KEY / OPENROUTER_API_KEY / ANTHROPIC_API_KEY
# at startup, so opting into the managed AI proxy works without code changes.
ai:
  managed: true
env:
  HERMES_HOME: /home/developer/.hermes
  PATH: /home/developer/.local/bin:/usr/local/bin:/usr/bin:/bin
params:
  - key: ai_provider
    type: select
    label: Default provider
    description: LLM provider Hermes uses for new conversations. The managed Rigbox proxy is OpenRouter-backed, so `openrouter` unlocks the full 200+ model catalog with the placeholder key.
    group: AI
    default: openrouter
    envVar: HERMES_DEFAULT_PROVIDER
    options:
      - { value: openrouter, label: "OpenRouter (200+ models)" }
      - { value: google,     label: "Google (Gemini)" }
      - { value: anthropic,  label: "Anthropic" }
      - { value: openai,     label: "OpenAI" }
  - key: ai_model
    type: string
    label: Default model
    description: Model slug for the chosen provider (e.g. `anthropic/claude-sonnet-4.5`, `google/gemini-2.5-pro`).
    group: AI
    default: google/gemini-2.5-pro
    envVar: HERMES_DEFAULT_MODEL
  # Messaging tokens — each enables one platform on the user-bus gateway service
  # that Hermes installs at first run (`hermes gateway install` + `enable`).
  - key: telegram_bot_token
    type: string
    label: Telegram bot token
    description: Token from @BotFather. Leave blank to skip Telegram.
    group: Messaging
    default: ""
    envVar: TELEGRAM_BOT_TOKEN
  - key: discord_bot_token
    type: string
    label: Discord bot token
    description: Bot token from a Discord application. Leave blank to skip Discord.
    group: Messaging
    default: ""
    envVar: DISCORD_BOT_TOKEN
