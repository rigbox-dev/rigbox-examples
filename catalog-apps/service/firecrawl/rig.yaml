name: firecrawl
port: 3002
# Firecrawl runs api + playwright + postgres-17 + redis + rabbitmq + a
# headless chromium in one VM. The dropped template hinted 4GB; we give it
# 4.5GB + 8GB disk to leave headroom for crawls and the playwright cache.
workspace:
  deployment:
    strategy: image
  # diskSizeMb holds the frozen install (~6GB: two node_modules trees,
  # Chromium, the apt stack) and sizes the builder VM that produces it.
  resources: { ramMb: 4608, vcpuCount: 2, diskSizeMb: 12288 }
# Freeze the whole stack into an image: `rig deploy` runs `install:` once in a
# builder VM (apt services, firecrawl@v2.9.0 + node_modules, chromium under
# /opt/pw-browsers, the playwright sidecar unit), snapshots the rootfs, and
# later deploys with unchanged inputs boot from the cached image.
# Footprint note: the builder VM boots with the platform default 3GB disk and
# this install lands around 6GB — see the README.
reproducible: true
install: |
  set -euo pipefail
  # Firecrawl v2.9.0 stack, frozen into the reproducible image. This script
  # installs:
  #   - PostgreSQL 17 + pg_cron, Redis, RabbitMQ (system services)
  #   - Node toolchain + corepack-managed pnpm@9 (v2.9.0 builds on pnpm 9, not 10)
  #   - The firecrawl repo at v2.9.0, with apps/api + apps/playwright-service-ts built
  #   - Playwright chromium under /opt/pw-browsers
  #   - A sidecar firecrawl-playwright.service systemd unit on :3000
  #
  # The postgres DB itself (the `firecrawl` role + database + nuq schema) is NOT
  # created here — postgres data lives at /var/lib/postgresql on the VM, not in
  # the image. start.sh creates the role/db on first boot.
  #
  # Runs as `developer` (passwordless sudo); root-only steps are prefixed with
  # sudo, the pnpm build steps run as the developer user like the unit does.

  FIRECRAWL_VERSION=v2.9.0
  PNPM_VERSION=9.15.4
  PG_PORT=5433
  GO_VERSION=1.24.4

  # Build-only env. sudo resets the environment, so DEBIAN_FRONTEND is also
  # passed inline on every apt line below.
  export DEBIAN_FRONTEND=noninteractive
  export PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers

  # ---------------------------------------------------------------------------
  # 1. apt: postgres-17 + pg_cron + redis + rabbitmq + build deps
  # ---------------------------------------------------------------------------
  sudo apt-get update -y
  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gnupg ca-certificates curl
  curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
    | sudo gpg --dearmor --yes -o /usr/share/keyrings/pgdg.gpg
  echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt bookworm-pgdg main" \
    | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
  sudo apt-get update -y
  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
    postgresql-17 \
    postgresql-17-cron \
    postgresql-client-17 \
    libpq-dev \
    redis-server \
    rabbitmq-server \
    git \
    build-essential \
    unzip
  sudo apt-get clean
  sudo rm -rf /var/lib/apt/lists/*

  # ---------------------------------------------------------------------------
  # 2. postgres config: pg_cron preload, trust local auth, listen on 5433
  #    (postgres runtime data dir is /var/lib/postgresql/17/main, untouched here)
  # ---------------------------------------------------------------------------
  PG_CONF=/etc/postgresql/17/main/postgresql.conf
  sudo sed -i "s/^#\?shared_preload_libraries.*/shared_preload_libraries = 'pg_cron'/" "$PG_CONF"
  sudo grep -q '^cron.database_name' "$PG_CONF" \
    || printf "\n# pg_cron settings\ncron.database_name = 'firecrawl'\n" | sudo tee -a "$PG_CONF" >/dev/null
  sudo sed -i "s/^port = .*/port = ${PG_PORT}/" "$PG_CONF"
  PG_HBA=/etc/postgresql/17/main/pg_hba.conf
  sudo sed -i 's/^local\s\+all\s\+all\s\+peer/local   all             all                                     trust/' "$PG_HBA"
  sudo grep -q '^host    all             all             127.0.0.1/32            md5' "$PG_HBA" \
    || printf 'host    all             all             127.0.0.1/32            md5\n' | sudo tee -a "$PG_HBA" >/dev/null

  # Bind redis to loopback — same as the catalog.
  sudo sed -i 's/^bind .*/bind 127.0.0.1 ::1/' /etc/redis/redis.conf

  # ---------------------------------------------------------------------------
  # 3. pnpm@9.15.4 via corepack. v2.9.0 silently skips esbuild install scripts
  #    under pnpm 10/11, so we pin 9.
  # ---------------------------------------------------------------------------
  sudo corepack enable
  sudo corepack prepare "pnpm@${PNPM_VERSION}" --activate
  sudo grep -qx 'resolution-mode=highest' /etc/npmrc 2>/dev/null \
    || echo 'resolution-mode=highest' | sudo tee -a /etc/npmrc >/dev/null

  # ---------------------------------------------------------------------------
  # 4. Go + Rust toolchains (needed to build the html-to-markdown .so and a few
  #    firecrawl native modules). The base image doesn't ship them; both are
  #    removed again in step 10.
  # ---------------------------------------------------------------------------
  export RUSTUP_HOME=/usr/local/rustup
  export CARGO_HOME=/usr/local/cargo
  export PATH=/usr/local/cargo/bin:/usr/local/go/bin:${PATH}
  curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
    | sudo RUSTUP_HOME="$RUSTUP_HOME" CARGO_HOME="$CARGO_HOME" sh -s -- -y --default-toolchain stable --profile minimal
  sudo chmod -R a+rw /usr/local/cargo /usr/local/rustup
  sudo rm -rf /usr/local/go
  curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | sudo tar -xz -C /usr/local
  sudo ln -sf /usr/local/go/bin/go /usr/local/bin/go
  sudo ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt

  # ---------------------------------------------------------------------------
  # 5. Clone firecrawl @ v2.9.0 and pin pnpm in every package.json.
  # ---------------------------------------------------------------------------
  [ -d /home/developer/firecrawl ] || git clone --depth 1 --branch "${FIRECRAWL_VERSION}" \
    https://github.com/firecrawl/firecrawl.git /home/developer/firecrawl
  find /home/developer/firecrawl -maxdepth 4 -name package.json -not -path '*/node_modules/*' \
    -exec node -e 'const fs=require("fs"); const p=process.argv[1]; const j=JSON.parse(fs.readFileSync(p,"utf8")); j.packageManager = "pnpm@'"${PNPM_VERSION}"'"; fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");' {} \;

  # ---------------------------------------------------------------------------
  # 6. Build the Go html-to-markdown shared library.
  # ---------------------------------------------------------------------------
  (cd /home/developer/firecrawl/apps/api/sharedLibs/go-html-to-md \
    && go build -buildmode=c-shared -o html-to-markdown.so html-to-markdown.go)

  # ---------------------------------------------------------------------------
  # 7. pnpm install + build api + playwright-service-ts (as developer).
  # --no-frozen-lockfile because v2.9.0's lockfile has an overrides mismatch.
  # ---------------------------------------------------------------------------
  (cd /home/developer/firecrawl/apps/api \
    && pnpm install --no-frozen-lockfile \
    && pnpm run build \
    && { pnpm prune --prod --ignore-scripts || true; })
  (cd /home/developer/firecrawl/apps/playwright-service-ts \
    && pnpm install --no-frozen-lockfile \
    && pnpm run build)

  # ---------------------------------------------------------------------------
  # 8. Playwright chromium under /opt/pw-browsers (world-readable so the dev
  #    user can launch it whether the service runs as root or developer).
  # ---------------------------------------------------------------------------
  sudo mkdir -p /opt/pw-browsers
  (cd /home/developer/firecrawl/apps/playwright-service-ts \
    && sudo PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers DEBIAN_FRONTEND=noninteractive \
         npx --yes playwright install --with-deps chromium </dev/null)
  sudo chmod -R a+rX /opt/pw-browsers

  # ---------------------------------------------------------------------------
  # 9. Sidecar systemd unit for the playwright service on :3000. Enabled only —
  #    start.sh brings it up (with postgres/redis/rabbitmq) on every boot.
  # ---------------------------------------------------------------------------
  sudo tee /etc/systemd/system/firecrawl-playwright.service >/dev/null <<'EOF'
  [Unit]
  Description=Firecrawl Playwright service
  After=network.target

  [Service]
  Type=simple
  User=developer
  Group=developer
  WorkingDirectory=/home/developer/firecrawl/apps/playwright-service-ts
  Environment=PORT=3000
  Environment=PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers
  ExecStart=/usr/local/bin/node /home/developer/firecrawl/apps/playwright-service-ts/dist/api.js
  Restart=always
  RestartSec=2

  [Install]
  WantedBy=multi-user.target
  EOF
  sudo systemctl enable firecrawl-playwright.service

  # ---------------------------------------------------------------------------
  # 10. Prune build caches + the toolchains we installed (only used at build).
  # ---------------------------------------------------------------------------
  rm -rf "$HOME/.cache/go-build" "$HOME/go" "$HOME/.npm/_cacache" "$HOME/.npm/_logs"
  pnpm store prune || true
  sudo rm -rf /root/.npm /usr/local/cargo /usr/local/rustup /usr/local/go /usr/local/bin/go /usr/local/bin/gofmt
# start.sh rsyncs in with the app: it ensures postgres is up, creates the
# firecrawl role + DB if missing, loads the nuq schema once, then exec's the
# firecrawl api harness.
start: bash start.sh
health:
  # v2.9.0 doesn't expose /v2/health; the harness returns 200 JSON at `/` once
  # the api is up. Generous timeout because postgres + nuq init runs on first
  # boot before the listener binds.
  path: /
  timeoutSeconds: 240
env:
  NODE_OPTIONS: --max-old-space-size=2048
  PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
params:
  - key: ai_proxy_mode
    type: select
    label: AI Proxy Mode
    description: Use Rigbox managed credits, bring your own OpenAI key, or disable AI features.
    group: AI Configuration
    default: "off"
    envVar: AI_PROXY_MODE
    options:
      - { value: managed, label: "Managed (Rigbox Credits)" }
      - { value: byok,    label: "Bring Your Own Key" }
      - { value: "off",   label: "Off" }
  - key: proxy_server
    type: string
    label: Proxy Server
    description: Optional. HTTP proxy for outbound scraping requests (e.g. http://host:port).
    group: Network
    default: ""
    envVar: PROXY_SERVER
  - key: proxy_username
    type: string
    label: Proxy Username
    description: Optional. Username for proxy authentication.
    group: Network
    default: ""
    envVar: PROXY_USERNAME
secrets:
  - name: OPENAI_API_KEY
  - name: PROXY_PASSWORD
credentials:
  # All three are generated on first deploy and shown once. They land in
  # /home/developer/.firecrawl/.env on every boot via start.sh.
  api_key:
    generate: true              # → CRED_API_KEY (the bearer for /v2/scrape etc.)
  postgres_password:
    generate: true              # → CRED_POSTGRES_PASSWORD
  bull_auth_key:
    generate: true              # → CRED_BULL_AUTH_KEY
