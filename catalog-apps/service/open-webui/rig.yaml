name: open-webui
port: 8080
# Open WebUI + a uv-managed Python 3.12 + the CPU torch wheel — the install
# footprint is sizeable, so the workspace disk is bumped well past the catalog
# minimum.
workspace:
  deployment:
    strategy: image
  resources: { ramMb: 2048, vcpuCount: 2, diskSizeMb: 8192 }
# Freeze the whole Python 3.12 venv (torch-cpu + open-webui) into an image:
# `rig deploy` runs `install:` once in a builder VM, snapshots the rootfs, and
# later deploys with unchanged inputs boot from the cached image instead of
# re-running pip. Bump APP_VERSION below to upgrade.
# Footprint note: the builder VM boots with the platform default 3GB disk; the
# torch wheel alone is most of a GB — see the README.
reproducible: true
install: |
  set -euo pipefail
  # Open WebUI (https://docs.openwebui.com/) — a full-featured chat UI for
  # OpenAI-compatible model endpoints. Pinned to a version that's known to boot
  # clean on the Rigbox base; bump APP_VERSION and redeploy to upgrade.
  #
  # Open WebUI pins its torch wheel to cp312, so we use uv to materialize a
  # Python 3.12 venv (the base ships Debian's 3.11) and install the CPU torch
  # wheel + open-webui from PyPI into it. The script runs as `developer`, which
  # owns $APP_HOME, so nothing here needs sudo.
  APP_HOME=/home/developer/.open-webui
  APP_VERSION=0.9.4
  TORCH_CPU_WHEEL_URL=https://download.pytorch.org/whl/cpu/torch-2.9.1%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl

  mkdir -p "$APP_HOME/data" "$APP_HOME/tmp"

  # Keep uv's caches inside $APP_HOME so the cleanup below reclaims all of them
  # — the builder VM's disk is the tight resource here.
  export UV_CACHE_DIR="$APP_HOME/.uv-cache"
  export UV_PYTHON_INSTALL_DIR="$HOME/.local/share/uv/python"
  export TMPDIR="$APP_HOME/tmp"

  /usr/local/bin/uv python install 3.12
  # --clear makes the venv step idempotent: a re-run rebuilds it from scratch
  # rather than layering onto a half-finished one.
  /usr/local/bin/uv venv --clear --python 3.12 "$APP_HOME/venv"
  /usr/local/bin/uv pip install --no-cache --python "$APP_HOME/venv/bin/python" \
    "$TORCH_CPU_WHEEL_URL" "open-webui==${APP_VERSION}"
  test -x "$APP_HOME/venv/bin/open-webui"

  rm -rf "$APP_HOME/.uv-cache" "$APP_HOME/tmp" "$HOME/.cache/uv"
  mkdir -p "$APP_HOME/tmp"
# Exec the open-webui binary straight out of the frozen venv — no wrapper, no
# shell rc files, no PATH munging at boot.
start: >-
  /home/developer/.open-webui/venv/bin/open-webui serve
  --host 0.0.0.0 --port 8080
health:
  path: /health
  timeoutSeconds: 600
# Route every chat through the Rigbox managed AI proxy: no API key in the VM,
# usage is metered against workspace credits. Open WebUI reads
# OPENAI_API_BASE_URL/OPENAI_API_KEY directly — both are injected by the
# workspace env layer when `managed: true`.
ai:
  managed: true
env:
  # Persistence: webui.db (chat history + config) lives under DATA_DIR, which
  # is outside the rsync zone — chats survive redeploys.
  DATA_DIR: /home/developer/.open-webui/data
  # Local-only auth: signups disabled, the workspace owner is the admin. Drop
  # ENABLE_SIGNUP if you want a multi-user instance.
  WEBUI_AUTH: "True"
  ENABLE_SIGNUP: "False"
  # Disable the Ollama integration entirely — we're proxy-only here.
  ENABLE_OPENAI_API: "True"
  ENABLE_OLLAMA_API: "False"
  # Sensible defaults for the model picker.
  DEFAULT_MODELS: rigbox/free
  DEFAULT_PINNED_MODELS: rigbox/free,qwen/qwen3-coder:free,meta-llama/llama-3.3-70b-instruct:free
  DEFAULT_MODEL_PARAMS: '{"max_tokens":4096}'
credentials:
  # First-boot admin login. `generate: true` mints a strong password once and
  # exposes it as $CRED_ADMIN_PASSWORD in the workspace; Open WebUI maps that
  # to WEBUI_ADMIN_PASSWORD via the catalog item — here you can map it the
  # same way, or just read the credential from `rig app credentials get`.
  admin_password:
    generate: true
