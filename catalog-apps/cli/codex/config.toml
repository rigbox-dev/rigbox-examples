# Routes the Codex CLI (v0.137+) through the Rigbox managed AI proxy. Codex no
# longer reads OPENAI_BASE_URL and only speaks the Responses wire, so the proxy
# is declared as a custom provider here. Omitting `supports_websockets` (default
# false) forces plain HTTP `POST <base_url>/responses` instead of the built-in
# openai provider's wss:// transport. The API key comes from $OPENAI_API_KEY,
# which the managed proxy's ~/.rigbox/proxy.env sets to the placeholder
# (the proxy authenticates by source IP, so the value is a sentinel).
model = "anthropic/claude-sonnet-4.5"
model_provider = "rigbox"

[model_providers.rigbox]
name = "Rigbox Managed AI"
base_url = "http://172.16.0.1:9090/v1"
env_key = "OPENAI_API_KEY"
wire_api = "responses"
