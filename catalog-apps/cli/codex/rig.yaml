name: codex
kind: cli
# Codex CLI is a TUI agent — the workspace is for SSH-CLI use. `kind: cli`
# declares that explicitly: no HTTP port, no health probe, no start command.
workspace:
  resources: { ramMb: 1024, vcpuCount: 1, diskSizeMb: 3072 }
# Freeze the CLI into an image: `rig deploy` runs `install:` once in a builder
# VM and later deploys boot from the cached image instead of re-running
# `npm install`. The script runs as `developer` with passwordless sudo.
reproducible: true
install: |
  set -euo pipefail
  # OpenAI's Codex CLI. @openai/codex publishes a global CLI; the base image
  # already points npm's global prefix at ~/.npm-global, so the install lands
  # at ~/.npm-global/bin/codex. We symlink to /usr/local/bin so it's on the
  # standard SSH PATH (login shells, ForceCommand, scripted execs).
  #
  # The install mirrors the catalog's codex/install.sh so this image and the
  # catalog-installed shape stay byte-compatible.

  # 1. Install the CLI as the developer user.
  npm install -g --no-fund --silent @openai/codex
  command -v codex >/dev/null 2>&1
  sudo ln -sfn "$HOME/.npm-global/bin/codex" /usr/local/bin/codex

  # 2. Codex 0.137+ reads its provider from ~/.codex/config.toml (not env), so the
  #    routing script only makes sure $OPENAI_API_KEY (the proxy placeholder) is
  #    present for the config's env_key. Sourced by every interactive login shell.
  sudo tee /etc/profile.d/codex-routing.sh >/dev/null <<'EOF'
  # Managed by rigbox-examples (codex). Codex 0.137+ reads its provider from
  # ~/.codex/config.toml (a custom provider pointed at the managed AI proxy over
  # the Responses wire — see step 3 of install:) and the API key from
  # $OPENAI_API_KEY. Make sure that key is present by sourcing the managed
  # proxy's env file, which every managed workspace ships. Sourced by every
  # interactive login shell.
  if [ -z "${OPENAI_API_KEY:-}" ] && [ -r "${HOME:-/home/developer}/.rigbox/proxy.env" ]; then
    . "${HOME:-/home/developer}/.rigbox/proxy.env"
  fi
  EOF
  sudo chmod 644 /etc/profile.d/codex-routing.sh

  # 3. Write the managed-AI provider config so `codex` works on first SSH with no
  #    key to set: a custom provider over the Responses wire pointed at the managed
  #    AI proxy (plain HTTP — no websocket). Owned by developer so the CLI reads it.
  mkdir -p "$HOME/.codex"
  cat > "$HOME/.codex/config.toml" <<'EOF'
  # Routes the Codex CLI (v0.137+) through the Rigbox managed AI proxy. Codex no
  # longer reads OPENAI_BASE_URL and only speaks the Responses wire, so the proxy
  # is declared as a custom provider here. Omitting `supports_websockets` (default
  # false) forces plain HTTP `POST <base_url>/responses` instead of the built-in
  # openai provider's wss:// transport. The API key comes from $OPENAI_API_KEY,
  # which the managed proxy's ~/.rigbox/proxy.env sets to the placeholder
  # (the proxy authenticates by source IP, so the value is a sentinel).
  model = "anthropic/claude-sonnet-4.5"
  model_provider = "rigbox"

  [model_providers.rigbox]
  name = "Rigbox Managed AI"
  base_url = "http://172.16.0.1:9090/v1"
  env_key = "OPENAI_API_KEY"
  wire_api = "responses"
  EOF
# Opt into the Rigbox managed AI proxy — no OpenRouter key to set, so deploying
# this example is never blocked on a local secret. Codex 0.137+ reads its
# provider from the ~/.codex/config.toml that `install:` writes (a custom
# provider over the Responses wire pointed at the managed proxy); the routing
# script just supplies the placeholder $OPENAI_API_KEY it expects, so `codex`
# works on first SSH.
ai:
  managed: true
