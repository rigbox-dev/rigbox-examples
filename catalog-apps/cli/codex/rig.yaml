name: codex
kind: cli
# Codex CLI is a TUI agent — the workspace is for SSH-CLI use. `kind: cli`
# declares that explicitly: no HTTP port, no health probe, no start command.
workspace:
  resources: { ramMb: 1024, vcpuCount: 1, diskSizeMb: 3072 }
build:
  dockerfile: Dockerfile
# Opt into the Rigbox managed AI proxy — no OpenRouter key to set, so deploying
# this example is never blocked on a local secret. Codex 0.137+ reads its
# provider from a baked ~/.codex/config.toml (a custom provider over the
# Responses wire pointed at the managed proxy); the routing script just supplies
# the placeholder $OPENAI_API_KEY it expects, so `codex` works on first SSH.
ai:
  managed: true
