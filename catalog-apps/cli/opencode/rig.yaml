name: opencode
kind: cli
# OpenCode is a TUI agent — the workspace is for SSH-CLI use. `kind: cli`
# declares that explicitly: no HTTP port, no health probe, no start command.
workspace:
  resources: { ramMb: 1024, vcpuCount: 1, diskSizeMb: 3072 }
build:
  dockerfile: Dockerfile
# OpenCode reads OPENROUTER_API_KEY natively — no env translation needed.
# Forward the operator's key into the workspace and you're done.
secrets:
  - OPENROUTER_API_KEY
