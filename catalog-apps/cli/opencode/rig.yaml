name: opencode
kind: cli
# OpenCode is a TUI agent — the workspace is for SSH-CLI use. `kind: cli`
# declares that explicitly: no HTTP port, no health probe, no start command.
workspace:
  resources: { ramMb: 1024, vcpuCount: 1, diskSizeMb: 3072 }
build:
  dockerfile: Dockerfile
# Opt into the Rigbox managed AI proxy — no OpenRouter key to set, so deploying
# this example is never blocked on a local secret. The image bakes an
# ~/.config/opencode/opencode.json that registers a custom OpenAI-compatible
# provider pointed at the managed proxy, so `opencode` works on first SSH.
ai:
  managed: true
