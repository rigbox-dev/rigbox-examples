name: markdown-notes
port: 8080
# Light Flask + SQLite app — 1GB is plenty.
workspace:
  resources: { ramMb: 1024, vcpuCount: 1, diskSizeMb: 3072 }
  volumes:
    - name: data
      mountPath: /home/developer/data
      sizeMb: 1024
  deployment:
    strategy: incremental
install: |
  python3 -m venv --copies .venv
  .venv/bin/python -m pip install -r requirements.txt
start: .venv/bin/gunicorn --bind 0.0.0.0:8080 app:app
health:
  path: /healthz
  timeoutSeconds: 30
volumes: [ data ]
env: {}
dependencyInputs:
  - requirements.txt
