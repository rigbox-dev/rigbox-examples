name: n8n
port: 8080
# n8n is memory-hungry — it OOMs (V8 "heap out of memory") in the default 1GB
# workspace. Give it the free-tier ceiling (2GB/2vCPU); NODE_OPTIONS raises the
# V8 old-space heap so the Node process has real headroom inside the VM.
workspace:
  resources:
    ramMb: 2048
    vcpuCount: 2
build:
  dockerfile: Dockerfile
  # n8n's node_modules is large; the base + install overflow the default rootfs.
  # Size the frozen image's ext4 generously so the docker→ext4 export fits.
  sizeMb: 8192
start: n8n start
health:
  path: /healthz
  timeoutSeconds: 120
env:
  DATA_DIR: /home/developer/data
  N8N_USER_FOLDER: /home/developer/data
  N8N_PORT: "8080"
  N8N_LISTEN_ADDRESS: 0.0.0.0
  N8N_SECURE_COOKIE: "false"
  N8N_RUNNERS_ENABLED: "true"
  NODE_OPTIONS: --max-old-space-size=1536
