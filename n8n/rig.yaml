# n8n dependencies stay inside each managed app release. Persistent user data
# stays in RIGBOX_APP_DATA_DIR. Code rollback does not reverse n8n migrations.

name: n8n
port: 8080
# n8n is memory-hungry — it OOMs (V8 "heap out of memory") in the default 1GB
# workspace. Give it the free-tier ceiling (2GB/2vCPU); NODE_OPTIONS raises the
# V8 old-space heap so the Node process has real headroom inside the VM.
workspace:
  resources:
    ramMb: 2048
    vcpuCount: 2
    # Allows room for dependencies and a retained previous release.
    diskSizeMb: 8192
  deployment:
    strategy: incremental
install: |-
  npm ci --omit=dev --no-audit --no-fund
start: bash start.sh
health:
  path: /healthz
  timeoutSeconds: 120
env:
  N8N_PORT: "8080"
  N8N_LISTEN_ADDRESS: 0.0.0.0
  N8N_SECURE_COOKIE: "false"
  N8N_RUNNERS_ENABLED: "true"
  NODE_OPTIONS: --max-old-space-size=1536
dependencyInputs:
  - package.json
  - package-lock.json
