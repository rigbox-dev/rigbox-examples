name: n8n
port: 8080
build:
  dockerfile: Dockerfile
  # n8n's node_modules is large; the base + install overflow the default rootfs.
  # Size the frozen image's ext4 generously so the docker→ext4 export fits.
  sizeMb: 8192
start: n8n start
health:
  path: /healthz
  timeoutSeconds: 90
env:
  DATA_DIR: /home/developer/data
  N8N_USER_FOLDER: /home/developer/data
  N8N_PORT: "8080"
  N8N_LISTEN_ADDRESS: 0.0.0.0
  N8N_SECURE_COOKIE: "false"
  N8N_RUNNERS_ENABLED: "true"
