name: n8n
port: 8080
# n8n is memory-hungry — it OOMs (V8 "heap out of memory") in the default 1GB
# workspace. Give it the free-tier ceiling (2GB/2vCPU); NODE_OPTIONS raises the
# V8 old-space heap so the Node process has real headroom inside the VM.
workspace:
  resources:
    ramMb: 2048
    vcpuCount: 2
    # Holds the frozen `npm install -g n8n` tree and sizes the builder VM
    # that produces it.
    diskSizeMb: 8192
  # N8N_USER_FOLDER points here: the SQLite DB, encrypted credentials, and any
  # community nodes installed from the UI. Apps run as a per-app system user,
  # so that write path needs BOTH this declaration and the `volumes: [data]`
  # opt-in below. 2GB leaves room for community nodes and execution history.
  volumes:
    - name: data
      mountPath: /home/developer/data
      sizeMb: 2048
# Freeze the heavy `npm install -g n8n` into an image: `rig deploy` runs
# `install:` once in a builder VM, snapshots the rootfs, and later deploys with
# unchanged inputs boot from the cached image and only rsync code.
reproducible: true
install: |
  set -euo pipefail
  # Global install to a system path so `n8n start` resolves on the unit's PATH.
  sudo npm install -g n8n
start: n8n start
health:
  path: /healthz
  timeoutSeconds: 120
volumes: [data]
env:
  DATA_DIR: /home/developer/data
  N8N_USER_FOLDER: /home/developer/data
  N8N_PORT: "8080"
  N8N_LISTEN_ADDRESS: 0.0.0.0
  N8N_SECURE_COOKIE: "false"
  N8N_RUNNERS_ENABLED: "true"
  NODE_OPTIONS: --max-old-space-size=1536
