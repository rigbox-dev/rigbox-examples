# n8n dependencies stay inside each managed app release. Persistent user data
# stays in RIGBOX_APP_DATA_DIR. Code rollback does not reverse n8n migrations.

name: n8n
port: 8080
# Cold dependency installation and native module compilation need headroom.
# Keep runtime data outside the retained release directories.
workspace:
  resources:
    ramMb: 3072
    vcpuCount: 2
    # Allows three retained artifacts plus a staged update, caches, and app data.
    diskSizeMb: 16384
  deployment:
    strategy: incremental
install: |-
  npm ci --omit=dev --no-audit --no-fund
start: bash start.sh
health:
  path: /healthz/readiness
  timeoutSeconds: 120
env:
  N8N_PORT: "8080"
  N8N_LISTEN_ADDRESS: 0.0.0.0
  N8N_SECURE_COOKIE: "false"
  N8N_RUNNERS_ENABLED: "true"
  NODE_OPTIONS: --max-old-space-size=1536
dependencyInputs:
  - package.json
  - package-lock.json
