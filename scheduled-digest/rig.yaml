name: scheduled-digest
port: 8080
# Tiny TypeScript worker — 1GB is plenty.
workspace:
  resources: { ramMb: 1024, vcpuCount: 1, diskSizeMb: 3072 }
  deployment:
    strategy: incremental
install: |-
  npm ci
start: npx tsx worker.ts
health:
  path: /healthz
  timeoutSeconds: 30
env: {}
params:
  - key: interval_minutes
    type: number
    label: Run every (minutes)
    description: How often the background worker appends a digest entry.
    group: Schedule
    default: "5"
    envVar: INTERVAL_MINUTES
    validationPattern: "^[0-9]+$"
dependencyInputs:
  - package.json
  - package-lock.json
