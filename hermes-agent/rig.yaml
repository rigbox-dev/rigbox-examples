name: hermes-agent
# Hermes' dashboard binds 0.0.0.0:9119 and refuses non-loopback without
# `--insecure`. The trust boundary is the rigbox subdomain layer.
port: 9119
# Playwright + Chromium baseline plus uv-managed Python 3.11 and a pre-built
# Vite SPA bundle — the install footprint is heavier than the catalog minimum,
# so bump the ext4 image so the docker→ext4 export fits.
workspace:
  resources: { ramMb: 2048, vcpuCount: 2, diskSizeMb: 4096 }
build:
  dockerfile: Dockerfile
  sizeMb: 6144
start: >-
  /home/developer/.local/bin/hermes dashboard
  --host 0.0.0.0 --port 9119 --no-open --insecure
health:
  # The only public (no-session-token) endpoint on the dashboard.
  path: /api/status
  timeoutSeconds: 90
# Hermes natively reads OPENAI_API_KEY / OPENROUTER_API_KEY / ANTHROPIC_API_KEY
# at startup, so opting into the managed AI proxy works without code changes.
ai:
  managed: true
env:
  HERMES_HOME: /home/developer/.hermes
  PATH: /home/developer/.local/bin:/usr/local/bin:/usr/bin:/bin
params:
  - key: ai_provider
    type: select
    label: Default provider
    description: LLM provider Hermes uses for new conversations. The managed Rigbox proxy is OpenRouter-backed, so `openrouter` unlocks the full 200+ model catalog with the placeholder key.
    group: AI
    default: openrouter
    envVar: HERMES_DEFAULT_PROVIDER
    options:
      - { value: openrouter, label: "OpenRouter (200+ models)" }
      - { value: google,     label: "Google (Gemini)" }
      - { value: anthropic,  label: "Anthropic" }
      - { value: openai,     label: "OpenAI" }
  - key: ai_model
    type: string
    label: Default model
    description: Model slug for the chosen provider (e.g. `anthropic/claude-sonnet-4.5`, `google/gemini-2.5-pro`).
    group: AI
    default: google/gemini-2.5-pro
    envVar: HERMES_DEFAULT_MODEL
  # Messaging tokens — each enables one platform on the user-bus gateway service
  # that Hermes installs at first run (`hermes gateway install` + `enable`).
  - key: telegram_bot_token
    type: string
    label: Telegram bot token
    description: Token from @BotFather. Leave blank to skip Telegram.
    group: Messaging
    default: ""
    envVar: TELEGRAM_BOT_TOKEN
  - key: discord_bot_token
    type: string
    label: Discord bot token
    description: Bot token from a Discord application. Leave blank to skip Discord.
    group: Messaging
    default: ""
    envVar: DISCORD_BOT_TOKEN
